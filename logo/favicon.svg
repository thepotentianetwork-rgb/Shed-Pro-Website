<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="64" height="64" fill="none">
  <!-- FAVICON VARIANT of logo/mark.svg. Not the mark scaled down: at 16px the
       mark's 3px strokes fall below one device pixel and the dimension ticks
       disappear, so this carries heavier strokes, drops the ticks and the
       vertical dimension line, and is centred in the box (the mark sits high in
       its own, which reads as off-centre in a square tab icon). -->
  <rect x="2" y="2" width="56" height="56" rx="13" fill="#14181C"/>
  <g stroke="#2BB5E8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 30 L30 17 L46 30"/>
    <path d="M17.5 31.5 V43 H42.5 V31.5"/>
  </g>
  <path d="M15 50 H45" stroke="#F8921E" stroke-width="4.5" stroke-linecap="round"/>
</svg>
